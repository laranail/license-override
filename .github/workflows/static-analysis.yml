name: Static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A branch-alias that lags the newest tag makes the default branch advertise an
  # old minor, so Composer can offer main to consumers pinned to that minor and
  # hand them newer code. This repository had drifted that way: v1.2.0 was tagged
  # while the alias still read 1.1.x-dev, and laranail/licence-override-vendor-presets
  # requires "^1.1". The check allows the alias to run ahead of the last tag —
  # normal mid-minor — and fails only when it falls behind.
  branch-alias:
    name: Branch alias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the drift check compares against the newest tag

      - name: Assert branch-alias has not fallen behind the newest tag
        run: bash .scripts/check-branch-alias.sh

  analyse:
    name: Pint · PHPStan · Rector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite, sodium
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Pint (lint)
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar
